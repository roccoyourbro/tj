  <style>
.ios{--n-page:#000;--n-card:#1C1C1E;--n-text:#fff;--n-sub:#98989F;--n-sep:rgba(84,84,88,.65);--n-fill:#2C2C2E;--n-field:#1C1C1E;--n-accent:#FFD60A;--n-on:#FFD60A;--n-ontext:#000;--n-red:#FF453A;color:var(--n-text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Inter,Roboto,system-ui,sans-serif;font-variant-numeric:normal}

body:has(.nb-list) .fab-w{display:none!important}

.nb-page{max-width:720px;margin:0 auto;padding:0 20px}

.nb-group{display:flex;flex:1;gap:2px;border-radius:11px;overflow:hidden}
.nb-group.small{flex:0 0 108px}
.ios .nb-group .nb-seg{flex:1;width:auto;height:42px;border:0;border-radius:0;background:var(--n-fill);color:var(--n-text);font-size:18px;display:flex;align-items:center;justify-content:center}

.nb-view-body.big img{max-width:none;max-height:none;width:250%;cursor:zoom-out}
@media(prefers-reduced-motion:reduce){.nb-card-row{transition:none!important}}
